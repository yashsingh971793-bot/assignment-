<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - Tech Club</title>
    <link rel="icon" href="favicon.ico">
</head>

<body>

    <h1>Tech Club Registration Form</h1>

    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="register.html">Register</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <form action="#" method="post">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name="date">
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <p>Select Your Interests:</p>

        <input type="checkbox" id="html" name="interest" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="interest" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="java" name="interest" value="Java">
        <label for="java">Java</label>

        <br><br>

        <label for="course">Select Course:</label>

        <select id="course" name="course">
            <option value="">Choose Course</option>
            <option value="web">Web Development</option>
            <option value="java">Java Programming</option>
            <option value="python">Python</option>
        </select>

        <br><br>

        <label for="message">Your Message:</label>
        <br>

        <textarea id="message" name="message"
        rows="5" cols="30"></textarea>

        <br><br>

        <button type="submit">Register Now</button>

        <button type="reset">Reset</button>

    </form>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <header>
            <h2>My Dashboard</h2>
        </header>

        <aside>
            <h3>Menu</h3>
            <p>Home</p>
            <p>About</p>
            <p>Contact</p>
        </aside>

        <main>
            <h2>Dashboard</h2>

            <div class="cards">

                <div class="card">
                    <span>👤</span>
                    <p>Users</p>
                </div>

                <div class="card">
                    <span>📊</span>
                    <p>Analytics</p>
                </div>

                <div class="card">
                    <span>💰</span>
                    <p>Revenue</p>
                </div>

                <div class="card">
                    <span>📦</span>
                    <p>Orders</p>
                </div>

            </div>
        </main>

        <footer>
            <p>My Dashboard Footer</p>
        </footer>

    </div>

</body>
</html>
